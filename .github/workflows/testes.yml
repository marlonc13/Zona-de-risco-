name: Testes

# Roda os testes em todo push (qualquer branch) e em todo pull request para a main.
on:
  push:
  pull_request:
    branches: [main]

# Se um novo push chegar na mesma branch, cancela a execução anterior que ainda estiver rodando
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test -- --ci
